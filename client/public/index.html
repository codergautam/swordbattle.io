  <!-- Swordbattle.io -->
  <script>
    console.log("%cSwordbattle.io %cV2\n%cA project by %cGautam\n\n%cgithub.com/codergautam", "color: orange; font-size: 30px;", "color: red; font-size: 30px;", "color: green; font-size: 20px;", "color: cyan; font-size: 20px", "color: grey; font-size: 10px");
    window._isCrazyGamesBasicLaunch = new URLSearchParams(window.location.search).has('crazygames');
  </script>



  <!-- Phaser removed: the game renders with Pixi (bundled) and no longer needs the ~1.17MB Phaser

  <!-- Google tag (gtag.js) -->
  <link rel="stylesheet" href="https://sdk.playlight.dev/playlight-sdk.css">
  <script type="module">
    try {
      if (window._isCrazyGamesBasicLaunch) {
        window.showPlaylight = async () => {};
      } else {
        const module = await import("https://sdk.playlight.dev/playlight-sdk.es.js");
        const playlightSDK = module.default;
        await playlightSDK.init({
          button: {
          position: 'bottom-right',
          visible: false
        },
        exitIntent: {
          enabled: false
        }
        });
        window.showPlaylight = async (visible = true) => {
          await playlightSDK.setDiscovery(visible)
        };
      }
    } catch (error) {
      console.error("Error loading the Playlight SDK:", error);
    }
  </script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-35EKK5X5R4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-35EKK5X5R4');
  </script>

  <!-- CrazyGames SDK -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <!-- Ads -->

  <script>
    window.adsenseClient = 'ca-pub-3340825671684972';

    const vidAdDelay = {
      adsense: 0, // the Ad Placement API does its own frequency capping
      adinplay: 1000 * 60 * 2, // 2 minutes
      gamemonetize: 1000 * 60 * 2, // 2 minutes
      gamepix: 0, // gamepix has its own logic it seems
      crazygames: 0 // Crazygames handles timing automatically
    };

    function checkAdProvider() {
      if (window._isCrazyGamesBasicLaunch) return 'crazygames';

      let adProvider = '<%= htmlWebpackPlugin.options.adProvider %>' || "adsense";
      // get query string in url check if other ad provider is set
      const validAdProviders = ["adsense", "adinplay", "gamemonetize", "gamepix"];
      const urlParams = new URLSearchParams(window.location.search);
      const adProviderParam = urlParams.get("adprovider");
      if (adProviderParam && validAdProviders.includes(adProviderParam)) {
        adProvider = adProviderParam;
      }
      return adProvider;
    }

    window.adProvider = checkAdProvider();
    console.log("Ad provider:", window.adProvider)

    window.loadAdinplay = function () {
      if (window._isCrazyGamesBasicLaunch) return Promise.resolve(false);
      if (window.aipDisplayTag && window.aipPlayer) return Promise.resolve(true);
      if (window.adinplayLoadPromise) return window.adinplayLoadPromise;

      window.aiptag = window.aiptag || {};
      window.aiptag.cmd = window.aiptag.cmd || [];
      window.aiptag.cmd.display = window.aiptag.cmd.display || [];
      window.aiptag.cmd.player = window.aiptag.cmd.player || [];

      window.aiptag.cmp = {
        show: true,
        position: "centered",
        button: true,
        buttonText: "Privacy settings",
        buttonPosition: "bottom-right"
      };

      window.adinplayLoading = true;
      window.adinplayLoadAttempts = (window.adinplayLoadAttempts || 0) + 1;
      window.adinplayStartedAt = Date.now();
      window.adinplayFailed = false;

      window.adinplayLoadPromise = new Promise(function (resolve) {
        const existingScript = document.getElementById('adinplay-sdk');
        if (existingScript) existingScript.remove();

        const adinplayScript = document.createElement('script');
        adinplayScript.id = 'adinplay-sdk';
        adinplayScript.async = true;
        adinplayScript.src = 'https://api.adinplay.com/libs/aiptag/pub/SWT/swordbattle.io/tag.min.js';
        adinplayScript.onload = function () {
          const ready = !!(window.aipDisplayTag && window.aipPlayer);
          const shouldRetry = !ready && window.adinplayLoadAttempts < 3;
          window.adinplayLoading = false;
          window.adinplayFailed = !ready && !shouldRetry;
          window.adinplayLoadPromise = null;
          if (ready) window.adinplayLoadAttempts = 0;
          else adinplayScript.remove();
          window.dispatchEvent(new CustomEvent('adinplayLoadStateChanged', { detail: { ready: ready, failed: !ready && !shouldRetry } }));
          if (shouldRetry) setTimeout(window.loadAdinplay, window.adinplayLoadAttempts * 4000);
          resolve(ready);
        };
        adinplayScript.onerror = function () {
          const shouldRetry = window.adinplayLoadAttempts < 3;
          window.adinplayLoading = false;
          window.adinplayFailed = !shouldRetry;
          window.adinplayLoadPromise = null;
          adinplayScript.remove();
          window.dispatchEvent(new CustomEvent('adinplayLoadStateChanged', { detail: { ready: false, failed: !shouldRetry } }));
          if (shouldRetry) setTimeout(window.loadAdinplay, window.adinplayLoadAttempts * 4000);
          resolve(false);
        };
        document.head.appendChild(adinplayScript);
      });

      return window.adinplayLoadPromise;
    };

    window.vidAdDelay = vidAdDelay[window.adProvider];
    window.lastVidAdTime = 0;

    if (!window._isCrazyGamesBasicLaunch) {
      try {
        if (window.localStorage.getItem("lastVidAdTime") && window.adProvider !== "gamemonetize") window.lastVidAdTime = parseInt(window.localStorage.getItem("lastVidAdTime"));
        if ((window.adProvider === "adinplay" || window.adProvider === "gamepix") && !window.localStorage.getItem("lastVidAdTime")) {
          console.log("New player! Resetting lastVidAdTime");
          window.lastVidAdTime = Date.now();
        }
      } catch (e) { };

      if (window.adProvider === "adsense") {
        window.adsbygoogle = window.adsbygoogle || [];
        window.adBreak = window.adConfig = function (o) { window.adsbygoogle.push(o); };

        window.adsenseStartedAt = Date.now();
        var s = document.createElement('script');
        s.async = true;
        s.setAttribute('data-ad-frequency-hint', '90s');
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + window.adsenseClient;
        s.crossOrigin = 'anonymous';
        s.onerror = function () { window.adsenseFailed = true; };
        document.head.appendChild(s);

        window.adConfig({
          preloadAdBreaks: 'on',
          sound: 'on',
          onReady: function () {
            window._adsenseReady = true;
            window.dispatchEvent(new CustomEvent('adsenseReady'));
          }
        });
      } else if (window.adProvider === "gamemonetize") {
        window.SDK_OPTIONS = {
          gameId: "m2yzvbmyf75dl11i5lrtzlykjkzrgb85",
          onEvent: function (a) {
            // dispatch event to game process
            const windowEvent = new CustomEvent("gamemonetize_event_" + a.name, { detail: a });
            console.log("gamemonetize_event_" + a.name, a);
            window.dispatchEvent(windowEvent);
          }
        };
        // load sdk
        (function (a, b, c) {
          var d = a.getElementsByTagName(b)[0];
          a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://api.gamemonetize.com/sdk.js", d.parentNode.insertBefore(a, d))
        })(document, "script", "gamemonetize-sdk");
      } else if (window.adProvider === "adinplay") {
        window.loadAdinplay();
      } else if (window.adProvider === "gamepix") {
        var gpScript = document.createElement('script');
        gpScript.src = 'https://integration.gamepix.com/sdk/v3/gamepix.sdk.js';
        document.head.appendChild(gpScript);
      }
    }
  </script>

    <!-- End of Ads -->

      <title>Swordbattle.io</title>
      <script>
        (function () {
          const retryKey = 'static-asset-retry';

          function retryWithFreshAssets() {
            try {
              if (sessionStorage.getItem(retryKey)) return;
              sessionStorage.setItem(retryKey, '1');
              const url = new URL(window.location.href);
              url.searchParams.set('assets', Date.now().toString());
              window.location.replace(url.toString());
            } catch (error) {}
          }

          window.addEventListener('error', function (event) {
            const element = event.target;
            if (!(element instanceof HTMLScriptElement) && !(element instanceof HTMLLinkElement)) return;
            const source = element.src || element.href;
            if (source && /\/static\/(?:js|css)\//.test(source)) retryWithFreshAssets();
          }, true);

          setTimeout(function () {
            try {
              sessionStorage.removeItem(retryKey);
            } catch (error) {}
          }, 10000);
        })();
      </script>

name: buildclient

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: client-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CI: false
      REACT_APP_API: api.swordbattle.io
      REACT_APP_ENDPOINT_US: na.swordbattle.io
      REACT_APP_ENDPOINT_EU: eu.swordbattle.io
      REACT_APP_API_BACKUP: api.swordbattle.io
      REACT_APP_ENDPOINT_US_BACKUP: na.swordbattle.io

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Keyed to asset CONTENT, not the commit. Using github.sha meant every push -
    # even a README typo - changed the ?v= on all ~1300 assets and forced every
    # returning player to re-download them. GitHub Pages caps Cache-Control at
    # max-age=600 and can't be configured, so cache stability is all we control.
    - name: Compute asset version from content
      run: echo "REACT_APP_ASSET_VER=$(find client/public/assets -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum | cut -c1-12)" >> $GITHUB_ENV

    - name: Install and Build
      run: |
        cd client
        yarn install
        yarn build

    - name: Stage static assets
      if: github.event_name != 'pull_request'
      run: |
        mkdir -p client/static-release
        cp -R client/build/static client/static-release/static

    - name: Deploy static assets
      if: github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./client/static-release
        keep_files: true

    - name: Deploy to GitHub Pages
      if: github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./client/build
        keep_files: true

name: buildclient

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: client-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CI: false
      # MUST match the game server's CAPTCHA_ENABLED. The client only sends a
      # captcha token when this is 'true'; a server with captcha still enforced
      # closes the socket of every client that does not send one, so flipping this
      # on or off means deploying the SERVER FIRST, then the client. This workflow
      # deploys the client automatically on push to main and the server not at all.
      REACT_APP_CAPTCHA_ENABLED: 'false'
      REACT_APP_RECAPTCHA_CLIENT_KEY: 6LdVxgYdAAAAAPtvjrXLAzSd2ANyzIkiSqk_yFpt
      REACT_APP_API: api.swordbattle.io
      REACT_APP_ENDPOINT_US: na.swordbattle.io
      REACT_APP_ENDPOINT_EU: eu.swordbattle.io
      REACT_APP_API_BACKUP: api.swordbattle.io
      REACT_APP_ENDPOINT_US_BACKUP: na.swordbattle.io

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Needs no dependencies: it compares source hashes against scripts/webp-manifest.json
    # and rejects two sources that would map to the same .webp name. That collision
    # ships the wrong art with a 200 OK, so the loader's fallback never fires and
    # nothing looks broken until someone notices the tile changed.
    - name: Check generated .webp assets are current
      run: cd client && node scripts/webp.js --check

    # Keyed to asset CONTENT, not the commit. Using github.sha meant every push -
    # even a README typo - changed the ?v= on all ~1300 assets and forced every
    # returning player to re-download them. GitHub Pages caps Cache-Control at
    # max-age=600 and can't be configured, so cache stability is all we control.
    - name: Compute asset version from content
      run: echo "REACT_APP_ASSET_VER=$(find client/public/assets -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum | cut -c1-12)" >> $GITHUB_ENV

    - name: Install and Build
      run: |
        cd client
        yarn install
        yarn build

    - name: Stage static assets
      if: github.event_name != 'pull_request'
      run: |
        mkdir -p client/static-release
        cp -R client/build/static client/static-release/static

    - name: Deploy static assets
      if: github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./client/static-release
        keep_files: true

    - name: Deploy to GitHub Pages
      if: github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./client/build
        keep_files: true
